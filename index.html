<div class="header"><div class="header-left"><div class="logo">UB</div><div><h1>UniFi Backup Explorer <span style="font-size:11px;color:var(--cyan);font-family:var(--mono)">v2.2</span></h1><div class="header-subtitle">Client-Side Decryptor · v10.x Aware</div></div></div><div class="file-info" id="fileInfo"></div></div>

<script>
// HTML escape — prevents XSS when inserting untrusted strings into innerHTML
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// BSON Decoder
class BSON{
  constructor(buf){this.v=new DataView(buf);this.b=new Uint8Array(buf);this.o=0;this.l=buf.byteLength;this.d=0}
  i32(){const v=this.v.getInt32(this.o,!0);this.o+=4;return v}
  i64(){const l=this.v.getUint32(this.o,!0),h=this.v.getInt32(this.o+4,!0);this.o+=8;return h*0x100000000+l}
  f64(){const v=this.v.getFloat64(this.o,!0);this.o+=8;return v}
  u8(){return this.b[this.o++]}
  cstr(){let s='';while(this.o<this.l){const c=this.b[this.o++];if(!c)break;s+=String.fromCharCode(c)}return s}
  str(){const n=this.i32();if(n<1||this.o+n>this.l)throw new Error('BSON string length out of bounds');const s=new TextDecoder().decode(this.b.slice(this.o,this.o+n-1));this.o+=n;return s}
  oid(){const h=Array.from(this.b.slice(this.o,this.o+12)).map(x=>x.toString(16).padStart(2,'0')).join('');this.o+=12;return h}
  bin(){const n=this.i32();const t=this.u8();if(n<0||this.o+n>this.l)throw new Error('BSON binary length out of bounds');this.o+=n;return`<bin:${t} ${n}B>`}
  doc(){if(++this.d>20){this.d--;throw new Error('BSON nesting too deep')}try{const sz=this.i32(),end=this.o-4+sz,d={};while(this.o<end-1){const t=this.u8();if(!t)break;const k=this.cstr();const v=this.val(t);if(k==='__proto__'||k==='constructor'||k==='prototype')continue;d[k]=v}this.o=end;return d}finally{this.d--}}
  arr(){if(++this.d>20){this.d--;throw new Error('BSON nesting too deep')}try{const sz=this.i32(),end=this.o-4+sz,a=[];while(this.o<end-1){const t=this.u8();if(!t)break;this.cstr();a.push(this.val(t))}this.o=end;return a}finally{this.d--}}
  val(t){switch(t){case 1:return this.f64();case 2:return this.str();case 3:return this.doc();case 4:return this.arr();case 5:return this.bin();case 6:return undefined;case 7:return{$oid:this.oid()};case 8:return this.u8()!==0;case 9:{const ms=this.i64();try{return{$date:new Date(ms).toISOString()}}catch(e){return{$date:'invalid',$dateMs:ms}}};case 10:return null;case 11:{const p=this.cstr(),f=this.cstr();return{$regex:p,$options:f}};case 13:return this.str();case 16:return this.i32();case 17:case 18:return this.i64();case 255:return{$minKey:1};case 127:return{$maxKey:1};default:throw new Error(`BSON type 0x${t.toString(16)} @${this.o}`)}}
  static all(buf){const d=new BSON(buf),docs=[];let e=0;while(d.o<d.l-4){try{if(d.l-d.o<5)break;const sz=d.v.getInt32(d.o,!0);if(sz<5||sz>d.l-d.o)break;docs.push(d.doc())}catch(x){e++;if(e>10)break;d.o++}}return docs}
}

// Publicly documented UniFi Network Application backup encryption constants.
// These are NOT secrets — Ubiquiti uses a fixed AES-128-CBC key/IV for all
// Network Application backups. They are widely known and documented in the
// UniFi community (key="bcyangkmluhomars", iv="ubntenterpriseap").
const KEY='626379616e676b6d6c756f686d617273',IV='75626e74656e74657270726973656170';
function hex2b(h){const b=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b}

async function decrypt(ab){
  const key=hex2b(KEY),iv=hex2b(IV),BS=16;
  const ck=await crypto.subtle.importKey('raw',key,{name:'AES-CBC'},!1,['decrypt']);
  const aLen=Math.floor(ab.byteLength/BS)*BS;
  if(!aLen)throw new Error('File too small');
  const data=new Uint8Array(ab.slice(0,aLen));
  log('info',`Data: ${aLen} bytes (${aLen/BS} blocks)`);

  // Try PKCS7 first
  try{const r=await crypto.subtle.decrypt({name:'AES-CBC',iv},ck,data);log('ok','Decrypted (PKCS7)');return r}catch(e){log('warn',`PKCS7: ${e.message}`)}

  // NoPadding workaround: append encrypted padding block (needs encrypt permission)
  try{
    log('info','Trying NoPadding workaround...');
    const ek=await crypto.subtle.importKey('raw',key,{name:'AES-CBC'},!1,['encrypt','decrypt']);
    const lastBlock=data.slice(aLen-BS);
    const padPlain=new Uint8Array(BS);padPlain.fill(BS);
    const encPad=await crypto.subtle.encrypt({name:'AES-CBC',iv:lastBlock},ek,padPlain);
    const full=new Uint8Array(aLen+BS);
    full.set(data);full.set(new Uint8Array(encPad).slice(0,BS),aLen);
    const r=await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,full);
    log('ok','Decrypted (NoPadding workaround)');
    return r;
  }catch(e){throw new Error(`Decryption failed: ${e.message}`)}
}

function gm(n){const m=CM[n];return m?{label:m.l,color:m.c,group:m.g}:{label:n,color:'#6b7d93',group:'Other'}}

// Collections known to contain credentials (WiFi passwords, RADIUS secrets, VPN keys, etc.)
const SENSITIVE_COLLS=new Set(['wlanconf','wireguard','vpnclient','account','setting','radiusprofile','device','user']);

// Debug log
let logs=[];
function log(t,m){logs.push({t,m});console.log(`[${t}] ${m}`);const el=document.getElementById('debugLog');if(el){el.innerHTML=logs.map(l=>`<div class="log-${l.t}">[${l.t.toUpperCase()}] ${esc(l.m)}</div>`).join('');el.scrollTop=el.scrollHeight}}

// JSON formatter
function fj(o,i=0){const p='  '.repeat(i),p1='  '.repeat(i+1);if(o===null)return'<span class="json-null">null</span>';if(o===undefined)return'<span class="json-null">undefined</span>';if(typeof o==='boolean')return`<span class="json-bool">${o}</span>`;if(typeof o==='number')return`<span class="json-number">${o}</span>`;if(typeof o==='string'){const e=esc(o);return`<span class="json-string">"${e.length>200?e.slice(0,200)+'…':e}"</span>`}if(Array.isArray(o)){if(!o.length)return'<span class="json-bracket">[]</span>';if(o.length<=3&&o.every(v=>typeof v!=='object'||v===null))return`<span class="json-bracket">[</span>${o.map(v=>fj(v,0)).join(', ')}<span class="json-bracket">]</span>`;return`<span class="json-bracket">[</span>\n${o.map(v=>`${p1}${fj(v,i+1)}`).join(',\n')}\n${p}<span class="json-bracket">]</span>`}if(typeof o==='object'){const k=Object.keys(o);if(!k.length)return'<span class="json-bracket">{}</span>';if(k.length===1&&k[0]==='$oid')return`<span class="json-string">"${esc(o.$oid)}"</span>`;if(k.length===1&&k[0]==='$date')return`<span class="json-number">${esc(o.$date)}</span>`;return`<span class="json-bracket">{</span>\n${k.map(key=>`${p1}<span class="json-key">"${esc(key)}"</span>: ${fj(o[key],i+1)}`).join(',\n')}\n${p}<span class="json-bracket">}</span>`}return String(o)}
function dl(d,i){return esc(d.name||d.key||d.hostname||d.mac||d.purpose||d.essid||(d._id?(typeof d._id==='object'?d._id.$oid:String(d._id)).substring(0,12)+'…':null)||`Doc ${i+1}`)}

  let focusId=null,selStart=null,selEnd=null;

// ============================================================
// AUDIT REPORT — print-friendly A4 view, credentials excluded
// ============================================================
// The report is built from the already-parsed S.colls collections. Every value
// is picked field-by-field below; no document is ever serialised wholesale, so
// secrets cannot leak through an unexpected field. For the record, these are
// the fields the report must never read:
//   x_passphrase, x_password, wpa_psk, x_wan_password, radius_secret,
//   x_radius_secret, wg_private_key, wg_public_key, public_key, private_key,
//   preshared_key, x_authkey, x_ssh_password, api_key, token
// Matches secret-bearing field names. Deliberately does NOT match a bare `key`:
// setting docs are keyed by `key` and zones carry `zone_key`, both non-secret —
// collecting those would make the leak check abort on ordinary text.
const AUDIT_FORBIDDEN=/passphrase|password|psk|secret|preshared|authkey|credential|token|(private|public|wep|iapp|wg|ssh|api|shared|identity|session)_?key/i;
// Collections the report reads from — also the search space for the leak check.
// `device` is included for the custom-zone slot map below; only zone names are
// ever read from it, but listing it here keeps it inside the leak check.
const AUDIT_SOURCES=['networkconf','firewallzone','firewallpolicy','firewallrule','wlanconf','wireguard','site','setting','device'];

// Belt-and-braces: collect every value stored under a secret-looking field name
// in the source collections, and confirm none of them made it into the output.
// Values under 8 chars are skipped — shorter ones collide with ordinary report
// text (a passphrase reused as an SSID prefix would abort every export), and 8
// is the WPA-PSK minimum length, so real passphrases are still covered.
function auditSecretValues(){
  const out=new Set();
  const walk=(v,key,depth)=>{
    if(depth>8||v===null||v===undefined)return;
    if(Array.isArray(v)){v.forEach(x=>walk(x,key,depth+1));return}
    if(typeof v==='object'){for(const k of Object.keys(v))walk(v[k],k,depth+1);return}
    if(key&&AUDIT_FORBIDDEN.test(key)){const s=String(v);if(s.length>=8)out.add(s)}
  };
  for(const c of AUDIT_SOURCES)for(const d of S.colls[c]||[])walk(d,null,0);
  return out;
}
// The report is HTML-escaped, so a secret containing & < > " ' appears in the
// output in escaped form. Test both encodings or the check silently passes on
// exactly the passphrases most likely to contain punctuation.
function auditLeakCheck(html){
  const leaked=[];
  for(const v of auditSecretValues())if(html.includes(v)||html.includes(esc(v)))leaked.push(v);
  return leaked;
}

function aOid(v){return v&&typeof v==='object'?String(v.$oid||''):(v==null?'':String(v))}
function aBool(v){return v===undefined||v===null?'—':(v?'Yes':'No')}
function aStr(v){return v===undefined||v===null||v===''?'—':String(v)}
function aCell(c){return c&&typeof c==='object'&&'html'in c?c.html:esc(c===undefined||c===null||c===''?'—':String(c))}
function aTable(headers,rows,empty){
  if(!rows.length)return`<p class="empty">${esc(empty)}</p>`;
  return`<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${aCell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
// Text of a cell, for emptiness tests — strips the markup of {html:…} cells.
function aText(c){return c&&typeof c==='object'&&'html'in c?c.html.replace(/<[^>]*>/g,''):String(c==null?'':c)}
// Drop optional columns that carry no value for nearly every row. The compiled
// ruleset records protocol/enabled/logging on only a handful of its entries, and
// a column of dashes is worse than no column.
function aPrune(headers,rows,optional,minFill){
  const drop=new Set(),lim=minFill===undefined?0.1:minFill;
  if(rows.length)for(const i of optional){
    const filled=rows.filter(r=>{const t=aText(r[i]).trim();return t!==''&&t!=='—'}).length;
    if(filled/rows.length<lim)drop.add(i);
  }
  if(!drop.size)return[headers,rows];
  return[headers.filter((_,i)=>!drop.has(i)),rows.map(r=>r.filter((_,i)=>!drop.has(i)))];
}

function aSiteName(){
  for(const d of S.colls.site||[])if(d.desc||d.name)return String(d.desc||d.name);
  for(const d of S.colls.setting||[])if(d.key==='super_identity'&&d.name)return String(d.name);
  return'Unknown site';
}
// Read from the archive's `version` file during extraction — not inferred, so
// an absent file is reported as unknown rather than guessed at from settings.
function aVersion(){return S.ver||'Not recorded in backup'}

// id → document indexes, built once per report
function aNetIndex(){const m={};for(const n of S.colls.networkconf||[])m[aOid(n._id)]=n;return m}
function aZoneIndex(){const m={};for(const z of S.colls.firewallzone||[])m[aOid(z._id)]=z.name||z.zone_key||'(unnamed)';return m}

function aNetworkRows(){
  const nets=(S.colls.networkconf||[]).slice().sort((a,b)=>
    (Number(a.vlan)||0)-(Number(b.vlan)||0)||String(a.name||'').localeCompare(String(b.name||'')));
  return nets.map(n=>{
    const dhcp=n.dhcpd_enabled?(n.dhcpd_start&&n.dhcpd_stop?`${n.dhcpd_start} – ${n.dhcpd_stop}`:'Enabled'):'Off';
    return[aStr(n.name),aStr(n.purpose),n.vlan_enabled===false?'untagged':aStr(n.vlan),
      {html:`<span class="mono">${esc(aStr(n.ip_subnet))}</span>`},dhcp,aBool(n.enabled)];

// Zone membership is stored on the network (networkconf.firewall_zone_id), not
// as a member list on the zone — older backups do carry an explicit list, so
// honour that when present and otherwise invert the network→zone references.
function aZoneMembers(){
  const byZone={};
  for(const n of S.colls.networkconf||[]){
    const zid=aOid(n.firewall_zone_id);
    if(zid)(byZone[zid]=byZone[zid]||[]).push(n.name||'(unnamed)');
  }
  return byZone;
}
function aZoneRows(netIdx,slots){
  const byZone=aZoneMembers();
  const slotOf={};for(const[k,v]of Object.entries(slots||{}))slotOf[v]=k;
  return(S.colls.firewallzone||[]).map(z=>{
    const ids=Array.isArray(z.network_ids)?z.network_ids:(Array.isArray(z.zone_members)?z.zone_members:null);
    const members=ids?ids.map(id=>{const n=netIdx[aOid(id)];return n?(n.name||'(unnamed)'):aOid(id)})
                     :(byZone[aOid(z._id)]||[]);
    const name=z.name||z.zone_key;
    return[aStr(name),aStr(slotOf[name]),members.length?members.join(', '):'—',String(members.length),aBool(z.default_zone)];
  });
}

// Firewall rule verbs and zone tokens as they appear in v10 chain names.
const FW_ACTIONS=new Set(['ACCEPT','ALLOW','DROP','REJECT','BLOCK','DENY','RETURN','MASQUERADE','LOG']);
const FW_ZONE_TOKENS=new Set(['WAN','LAN','LOCAL','GUEST','VPN','DMZ','ZONED','IN','OUT','NAT','FORWARD',
  'CUSTOM','CUSTOM1','CUSTOM2','CUSTOM3','CUSTOM4','HOTSPOT','INTERNAL','EXTERNAL','GATEWAY']);

// User-created zones are compiled to CUSTOM1..CUSTOMn slots, and rule names
// reference the slot rather than the zone. The gateway's generated config names
// each slot ("CUSTOM1_subnets" → "corporate zone subnets"), so read the mapping
// from there instead of guessing at creation order. Zone names only.
function aCustomZoneSlots(){
  const map={};
  for(const d of S.colls.device||[]){
    if(typeof d.system_config!=='string')continue;
    for(const m of d.system_config.matchAll(/"name"\s*:\s*"CUSTOM(\d+)_subnets"[^}]*\}\s*,\s*"description"\s*:\s*"(.*?) zone subnets"/g))
      map['CUSTOM'+m[1]]=m[2];
  }
  return map;
}
// Chain names encode the pair: WAN_LOCAL_ALLOW → WAN → LOCAL, GUEST_IN_BLOCK →
// GUEST → IN. Strip the trailing verb, then split if both halves name a zone.
function aPairFromToken(tok,slots){
  if(!tok)return null;
  const t=String(tok).toUpperCase().replace(/_(ALLOW|BLOCK|DROP|REJECT|DENY|FILTER|MASQUERADE|PORT_FORWARD)$/,'');
  const p=t.split('_');
  if(p.length!==2||!FW_ZONE_TOKENS.has(p[0])||!FW_ZONE_TOKENS.has(p[1]))return null;
  const lbl=x=>(slots&&slots[x])?slots[x]:x;
  return`${lbl(p[0])} → ${lbl(p[1])}`;
}
// Zone pair — newer backups may carry explicit source/destination zone ids;
// this one encodes the pair in the jump target or the chain type instead.
function aZonePair(r,zoneIdx,slots){
  const nm=v=>{const k=aOid(v);return k?(zoneIdx[k]||k):null};
  const s=nm((r.source||{}).zone_id)||nm(r.src_zone_id)||nm(r.src_zone);
  const d=nm((r.destination||{}).zone_id)||nm(r.dst_zone_id)||nm(r.dst_zone);
  if(s||d)return`${s||'—'} → ${d||'—'}`;
  // Generated rules carry the exact pair in a bracketed name prefix, e.g.
  // "[CUSTOM1_WAN]Allow All Traffic" — more precise than the chain type.
  const br=/^\[([A-Z0-9_]+)\]/.exec(String(r.name||''));
  if(br){const p=aPairFromToken(br[1],slots);if(p)return p}
  const tgt=String(r.target||'').toUpperCase();
  if(tgt&&!FW_ACTIONS.has(tgt)){const p=aPairFromToken(tgt,slots);if(p)return p}
  const p2=aPairFromToken(r.ruleset||r.type,slots);
  if(p2)return p2;
  return aStr(r.ruleset||r.type);
}
// Action — v10 stores the verb in `target`; a non-verb target is a jump to
// another chain, which the zone-pair column already names.
function aRuleAction(r){
  const t=String(r.target||'').toUpperCase();
  if(FW_ACTIONS.has(t))return t;
  if(r.action)return String(r.action).toUpperCase();
  if(t)return'JUMP';
  // NAT chains name their own verb (NAT_WAN_MASQUERADE, DNAT, SNAT).
  const ty=String(r.type||'').toUpperCase();
  if(/MASQUERADE/.test(ty))return'MASQUERADE';
  if(/^[DS]NAT$/.test(ty))return ty;
  return'—';
}
function aRuleIndex(r){
  const v=r.rule_index!==undefined?r.rule_index:r.index;
  const n=Number(v);return Number.isFinite(n)?n:Number.MAX_SAFE_INTEGER;
}
// The user-authored zone policies — what the UI calls Firewall Rules. These
// carry explicit source/destination zone ids, so aZonePair resolves them by name.
function aPolicyRows(zoneIdx,slots){
  const pol=(S.colls.firewallpolicy||[]).map((r,i)=>({r,i}))
    .sort((a,b)=>aRuleIndex(a.r)-aRuleIndex(b.r)||a.i-b.i);
  return pol.map(({r},i)=>{
    const act=aRuleAction(r);
    const cls=/ALLOW|ACCEPT/.test(act)?'act-allow':(/BLOCK|DROP|REJECT|DENY/.test(act)?'act-block':'');
    return[String(i+1),aStr(r.name||r.description),aZonePair(r,zoneIdx,slots),
      {html:`<span class="act ${cls}">${esc(act)}</span>`},
      aStr(r.protocol),aBool(r.enabled),aBool(r.logging)];
  });
}
// Adopted hardware. Nothing here is a credential — model, name, firmware, state.
function aDeviceRows(){
  const label={0:'Offline',1:'Connected',2:'Pending adoption',4:'Upgrading',5:'Provisioning',6:'Unreachable',11:'Isolated'};
  // The collection also holds per-device config snapshots (device_type +
  // system_config, no hardware fields) — those are not inventory entries.
  return(S.colls.device||[]).filter(d=>d.model||d.version)
    .sort((a,b)=>String(a.type||'').localeCompare(String(b.type||''))||String(a.model||'').localeCompare(String(b.model||'')))
    .map(d=>{
      const state=d.disabled?'Disabled':(d.adopted===false?'Not adopted':(label[d.state]||(d.adopted?'Adopted':'—')));
      return[aStr(d.model),aStr(d.name),aStr(d.version),state];
    });
}
function aRuleRows(zoneIdx,slots){
  // Group by chain, then explicit index where the backup records one, then the
  // order the documents are stored in — which is the order they are evaluated.
  const rules=(S.colls.firewallrule||[]).map((r,i)=>({r,i})).sort((a,b)=>
    String(a.r.ruleset||a.r.type||'').localeCompare(String(b.r.ruleset||b.r.type||''))
    ||aRuleIndex(a.r)-aRuleIndex(b.r)||a.i-b.i);
  return rules.map(({r},i)=>{
    const act=aRuleAction(r);
    const cls=/ALLOW|ACCEPT/.test(act)?'act-allow':(/BLOCK|DROP|REJECT|DENY/.test(act)?'act-block':'');
    return[String(i+1),aStr(r.ruleset||r.type),aStr(r.name||r.description),aZonePair(r,zoneIdx,slots),
      {html:`<span class="act ${cls}">${esc(act)}</span>`},
      aStr(r.protocol),aBool(r.enabled),aBool(r.logging!==undefined?r.logging:r.logging_enabled)];
  });
}

function aWifiSecurity(w){
  const map={open:'Open (no encryption)',wpapsk:'WPA-PSK',wpaeap:'WPA-Enterprise (802.1X)',wep:'WEP',osen:'OSEN'};
  const p=[map[w.security]||aStr(w.security)];
  if(w.wpa_mode)p.push(String(w.wpa_mode).toUpperCase());
  if(w.wpa3_support)p.push('WPA3');
  if(w.pmf_mode&&w.pmf_mode!=='disabled')p.push('PMF '+w.pmf_mode);
  return p.join(' · ');
}
function aWifiRows(netIdx){
  return(S.colls.wlanconf||[]).slice().sort((a,b)=>
    String(a.name||a.essid||'').localeCompare(String(b.name||b.essid||''))).map(w=>{
    const n=netIdx[aOid(w.networkconf_id)];
    const vlan=w.vlan!==undefined&&w.vlan!==null&&w.vlan!==''?w.vlan:(n?n.vlan:undefined);
    return[aStr(w.name||w.essid),aWifiSecurity(w),n?aStr(n.name):'—',
      vlan===undefined||vlan===null||vlan===''?'untagged':String(vlan),
      aBool(w.enabled),aBool(w.is_guest),aBool(w.hide_ssid)];
  });
}

// WireGuard — names only. Keys, addresses and endpoints are deliberately omitted.
function aWgRows(netIdx){
  const rows=[];
  const net=d=>{const n=netIdx[aOid(d.networkconf_id)];return n?aStr(n.name):'—'};
  for(const d of S.colls.wireguard||[]){
    const iface=aStr(d.name||d.interface_name);
    const peers=Array.isArray(d.peers)?d.peers:(Array.isArray(d.wg_peers)?d.wg_peers:null);
    if(peers&&peers.length)peers.forEach(p=>rows.push([aStr(p.name||p.description||p.remark),iface,aBool(p.enabled)]));
    else rows.push([iface,net(d),aBool(d.enabled)]);
  }
  return rows;
}

function openAuditReport(){
  if(S.phase!=='ready'){toast('Load a backup first','error');return}
  const w=window.open('','_blank');
  if(!w){toast('Popup blocked — allow popups for this page to open the audit report','error');return}
  const html=buildAuditReport();
  const leaked=auditLeakCheck(html);
  if(leaked.length){w.close();toast(`Audit report aborted: ${leaked.length} credential value(s) would have been included. This is a bug — please report it.`,'error');return}
  w.document.open();w.document.write(html);w.document.close();
  setTimeout(()=>{try{w.focus();w.print()}catch(e){}},300);
  toast('Audit report opened — credentials excluded');
}

// Firewall rule type strings used in UniFi v10.x zone-based policy engine
const FW_RULE_TYPES = new Set(['ZONED_IN','ZONED_WAN_BLOCK','ZONED_WAN_ALLOW','ZONED_IN_ALLOW','ZONED_IN_BLOCK','ZONED_IN_FILTER','ZONED_WAN_PORT_FORWARD','CUSTOM_IN_BLOCK','CUSTOM_IN_ALLOW','CUSTOM_LOCAL_ALLOW','LOCAL_CUSTOM_ALLOW','FIREWALL_POLICY','WAN_IN','WAN_IN_ALLOW','WAN_IN_BLOCK','WAN_LOCAL_ALLOW','WAN_LOCAL_BLOCK','WAN_LOCAL_VPN','WAN_LOCAL_WAN','WAN_WAN_LOCAL','WAN_WAN_IN','WAN_PORT_FORWARD','LAN_IN_ALLOW','LAN_IN_BLOCK','LAN_LOCAL_ALLOW','LOCAL_LAN_ALLOW','GUEST_IN_BLOCK','GUEST_IN_ALLOW','GUEST_LOCAL_BLOCK','GUEST_LOCAL_ALLOW','LOCAL_GUEST_ALLOW','DMZ_IN_BLOCK','DMZ_IN_ALLOW','DMZ_LOCAL_ALLOW','DMZ_LOCAL_BLOCK','LOCAL_DMZ_ALLOW','VPN_IN_ALLOW','VPN_IN_BLOCK','VPN_LOCAL_ALLOW','LOCAL_VPN_ALLOW','VPN_ZONED_PORT_FORWARD','ACCOUNTING_PORT_FORWARD','NAT_WAN_MASQUERADE','FORWARD_IN','LOCAL_WAN_ALLOW']);

// Categorize BSON docs — comprehensive v10.x categorizer
function cat(d){
  // Tombstones — deletion records (delete_time + reference_id). Must be first.
  if(d.delete_time!==undefined&&d.reference_id!==undefined)return'tombstone';

  // Schema descriptor docs — __cmd select statements
  if(d.__cmd!==undefined)return'schema';

  // Settings — key field with or without site_id (super_* settings have no site_id)
  if(d.key!==undefined&&(d.site_id!==undefined||String(d.key).startsWith('super_')))return'setting';

  // Firewall — zone-based (v7.x+). Built-in zones carry zone_key; user-created
  // zones carry only name + default_zone, so match on that too or they fall
  // through to uncategorized and disappear from the zone list.
  if(d.zone_key!==undefined||d.zone_members!==undefined)return'firewallzone';
  if(d.default_zone!==undefined&&d.name!==undefined&&d.site_id!==undefined)return'firewallzone';

  // Firewall — v10 zone policies: the rules the user actually authors in the UI,
  // distinct from the compiled chains in firewallrule. Must precede the
  // scheduletask check below, because a policy carries a `schedule` object and
  // would otherwise be filed as a scheduled task.
  if(d.source!==undefined&&d.destination!==undefined&&d.action!==undefined)return'firewallpolicy';
  if(d.src_zone!==undefined&&d.dst_zone!==undefined)return'zonematrix';

  // Firewall — v10.x typed policy rules (ZONED_IN, WAN_IN_BLOCK etc.)
  if(d.type!==undefined&&FW_RULE_TYPES.has(d.type))return'firewallrule';

  // Firewall — classic rules
  if(d.ruleset!==undefined||d.rule_index!==undefined||d.action_group_id!==undefined)return'firewallrule';
  if(d.group_members!==undefined&&d.group_type!==undefined)return'firewallgroup';

  // Traffic rules / routes (v7.x+)
  if(d.matching_target!==undefined&&d.action!==undefined&&!d.ruleset)return'trafficrule';
  if(d.type==='VLAN'&&d.target!==undefined&&d.in_interface!==undefined)return'trafficroute';
  if(d.next_hop!==undefined||(d.type==='route'&&d.network!==undefined))return'trafficroute';
  if(d.type==='static-route'||d.static_route_network!==undefined)return'routing';

  // Port forward
  if(d.pfwd_interface!==undefined||(d.fwd!==undefined&&d.dst_port!==undefined))return'portforward';

  // Networks / VLANs — including WAN interfaces (purpose=wan)
  if(d.purpose!==undefined&&(d.networkgroup!==undefined||d.ip_subnet!==undefined||d.dhcpd_enabled!==undefined||d.vlan_enabled!==undefined||d.wan_type!==undefined||d.wan_networkgroup!==undefined))return'networkconf';
  if(d.purpose==='corporate'||d.purpose==='guest'||d.purpose==='vlan-only'||d.purpose==='wan')return'networkconf';

  // WiFi
  if(d.essid!==undefined||d.wlan_band!==undefined||(d.security!==undefined&&d.name!==undefined&&d.wpa_mode!==undefined))return'wlanconf';

  // Switch port profiles (portconf) — must check before device
  if(d.port_overrides!==undefined&&d.mac===undefined)return'portconf';
  if(d.poe_mode!==undefined&&d.op_mode!==undefined&&d.mac===undefined)return'portconf';

  // DHCP
  if(d.dhcpd_dns_1!==undefined||d.dhcpd_gateway_enabled!==undefined||(d.subnet!==undefined&&d.dhcpd_enabled!==undefined&&!d.purpose))return'dhcpd';

  // Device config snapshot (UDM system_config blob)
  if(d.device_type!==undefined&&d.mac!==undefined&&d.system_config!==undefined)return'device';

  // Devices (must come before user — devices have model)
  if(d.mac!==undefined&&d.model!==undefined)return'device';

  // Known clients / users
  if(d.mac!==undefined&&(d.hostname!==undefined||d.name!==undefined||d.oui!==undefined)&&d.model===undefined)return'user';

  // User groups
  if(d.attr_hidden_id==='usergroup'||d.qos_rate_max_down!==undefined)return'usergroup';

  // WLAN groups
  if(d.attr_hidden_id==='wlangroup'||(d.roam_mode!==undefined&&d.name!==undefined))return'wlangroup';

  // Network groups / IP groups
  if(d.attr_hidden_id==='networkgroup'||(d.group_type==='address-group'))return'networkgroup';
  if(d.group_type==='ipv4-address-group'||d.group_type==='ipv6-address-group')return'ipgroup';

  // RADIUS
  if(d.x_password!==undefined&&d.tunnel_type===undefined)return'account';
  if(d.radius_auth_type!==undefined||d.radius_ip_1!==undefined||d.attr_hidden_id==='radiusprofile')return'radiusprofile';

  // Hotspot / vouchers / guest tokens
  if(d.note!==undefined&&d.quota!==undefined&&d.duration!==undefined)return'voucher';
  if(d.hotspot_package_id!==undefined||d.attr_hidden_id==='hotspotpackage')return'hotspot';
  if(d.end!==undefined&&d.ap_mac!==undefined&&d.site_id!==undefined&&d.authorized!==undefined)return'guesttoken';

  // DPI
  if(d.app_id!==undefined&&d.cat_id!==undefined)return'dpiapp';
  if(d.dpiapp_ids!==undefined||d.attr_hidden_id==='dpigroup')return'dpigroup';

  // Tags
  if(d.member_table!==undefined||(d.tag_type!==undefined&&d.name!==undefined))return'tag';

  // Scheduled tasks
  if(d.job!==undefined||d.cron_expr!==undefined||(d.schedule!==undefined&&d.action!==undefined))return'scheduletask';

  // VPN / WireGuard / Teleport
  if(d.wg_public_key!==undefined||d.wg_private_key!==undefined||(d.public_key!==undefined&&d.allowed_ips!==undefined))return'wireguard';
  if(d.teleport!==undefined||d.attr_hidden_id==='teleport')return'teleport';
  if(d.vpn_type!==undefined||d.l2tp_interface!==undefined)return'vpnclient';

  // System / health / stats
  if(d.subsystem!==undefined&&d.status!==undefined&&d.num_user!==undefined)return'health';
  if(d.subsystem!==undefined&&d.key!==undefined&&d.site_id===undefined)return'alarm';
  if(d.datetime!==undefined&&d.subsystem!==undefined&&d.key!==undefined)return'event';
  if(d.time!==undefined&&d.bytes!==undefined)return'stat';

  // Privileges
  if(d.permissions!==undefined&&d.role!==undefined)return'privilege';

  // Site info
  if(d.attr_hidden_id==='site'||(d.country_code!==undefined&&d.timezone!==undefined&&d.name!==undefined))return'site';

  return null;
}

// ============================================================
// MAIN PROCESSOR
// ============================================================
async function proc(file){
  logs=[];set({phase:'processing',fn:file.name,fs:file.size,step:'Reading…'});await wait(50);
  try{
    const fn=file.name.toLowerCase();
    if(fn.includes('unifi_os_backup')||fn.includes('unifi_core_backup')||fn.endsWith('.unifi'))
      throw new Error('Wrong backup type! This is a UniFi OS System backup.\nUse Network Application backup (.unf) from:\nSettings → Control Plane → Backups');

    log('info',`File: ${file.name} (${fSz(file.size)})`);
    const ab=await file.arrayBuffer();
    const hd=new Uint8Array(ab.slice(0,16));
    log('info',`Header: ${Array.from(hd).map(b=>b.toString(16).padStart(2,'0')).join(' ')}`);

    let zipBuf;
    if(hd[0]===0x50&&hd[1]===0x4B){log('info','Already a ZIP');zipBuf=ab}
    else{
      set({step:'Decrypting AES-128-CBC…'});await wait(50);
      const dec=await decrypt(ab);
      const dh=new Uint8Array(dec).slice(0,16);
      log('info',`Decrypted header: ${Array.from(dh).map(b=>b.toString(16).padStart(2,'0')).join(' ')}`);

      // KEY FIX: Pad decrypted data to handle UniFi's known zip corruption (off-by-one)
      // UniFi backups are known to produce malformed zips that need `zip -FF` repair
      // The zip metadata references bytes beyond the actual data boundary
      // Adding padding bytes fixes this without needing external zip repair
      const padSize = 4096; // Extra padding bytes
      const padded = new Uint8Array(dec.byteLength + padSize);
      padded.set(new Uint8Array(dec));
      // Fill padding with zeros (safe for zip - will be ignored beyond actual data)
      const paddedBuf = padded.buffer;
      log('info', `Padded decrypted data: ${dec.byteLength} → ${paddedBuf.byteLength} bytes (+${padSize} padding for zip repair)`);

      if(dh[0]===0x50&&dh[1]===0x4B){log('ok','Valid ZIP after decrypt');zipBuf=paddedBuf}
      else{
        log('warn','No ZIP header at offset 0, scanning…');
        const found=findPK(paddedBuf);
        if(!found)throw new Error('No ZIP data found after decryption');
        zipBuf=found;
      }
    }

    // Parse ZIP — 3-stage fallback
    set({step:'Extracting zip…'});await wait(50);

    // Stage 1: Normal JSZip parse
    // Stage 2: Re-locate PK header and retry
    // Stage 3: Manual local-header scan (handles missing/corrupt central directory)
    let entries_raw = null; // [{name, getData()}]

    try{
      const zip = await JSZip.loadAsync(zipBuf);
      const names = Object.keys(zip.files).filter(e=>!zip.files[e].dir);
      entries_raw = names.map(n=>({name:n, getData:()=>zip.files[n].async('arraybuffer')}));
      log('ok',`ZIP parsed normally: ${names.join(', ')}`);
    }catch(e1){
      log('warn',`ZIP attempt 1 failed: ${e1.message}`);
      // Stage 2: find PK offset and retry
      try{
        const found = findPK(zipBuf);
        if(found){
          const zip2 = await JSZip.loadAsync(found);
          const names = Object.keys(zip2.files).filter(e=>!zip2.files[e].dir);
          entries_raw = names.map(n=>({name:n, getData:()=>zip2.files[n].async('arraybuffer')}));
          log('ok',`ZIP parsed from PK offset: ${names.join(', ')}`);
        }
      }catch(e2){log('warn',`ZIP attempt 2 failed: ${e2.message}`);}

      // Stage 3: manual local-header scan — bypass central directory entirely
      if(!entries_raw){
        log('warn','Falling back to manual local-header scan…');
        entries_raw = manualZipScan(zipBuf);
        if(entries_raw.length) log('ok',`Manual scan found ${entries_raw.length} entries: ${entries_raw.map(e=>e.name).join(', ')}`);
        else throw new Error('No ZIP entries found by any method');
      }
    }

    // Parse BSON
    set({step:'Parsing database…'});await wait(50);
    const colls={};
    let ver='';

    for(const entry of entries_raw){
      let data = await entry.getData();
      let fname = entry.name.split('/').pop();
      log('info',`${fname} (${fSz(data.byteLength)})`);

      if(fname.endsWith('.gz')){
        try{data=pako.inflate(new Uint8Array(data)).buffer;fname=fname.replace('.gz','');log('ok',`Decompressed → ${fSz(data.byteLength)}`)}
        catch(e){log('warn',`Decompress fail: ${e.message}`);continue}
      }

      if(fname.endsWith('.bson')){
        const cn=fname.replace('.bson','');
        const docs=BSON.all(data);
        log('ok',`${cn}: ${docs.length} docs`);
        if(docs.length)colls[cn]=docs;
      }else if(fname==='db'){
        const docs=BSON.all(data);
        log('ok',`db dump: ${docs.length} total docs`);
        let unc=0;
        for(const d of docs){const cn=cat(d)||'uncategorized';if(cn==='uncategorized')unc++;if(!colls[cn])colls[cn]=[];colls[cn].push(d)}
        if(unc)log('warn',`${unc} uncategorized docs`);
      }else if(fname==='version'){
        // Controller version that wrote the backup. Plain text ("10.1.5") in most
        // builds, occasionally JSON — take the first version-shaped token either way.
        if(data.byteLength>4096){log('warn','version file implausibly large, ignoring');continue}
        const txt=new TextDecoder().decode(new Uint8Array(data));
        const m=txt.match(/\d+\.\d+(?:\.\d+)*(?:[-+][0-9A-Za-z.]+)?/);
        if(m){ver=m[0].slice(0,32);log('ok',`Controller version: ${ver}`)}
        else log('warn','version file present but held no recognisable version');
      }
    }

    if(!Object.keys(colls).length)throw new Error('No collections found in backup');
    const sorted={};Object.keys(colls).sort().forEach(k=>sorted[k]=colls[k]);
    const td=Object.values(sorted).reduce((s,d)=>s+d.length,0);
    log('ok',`✓ ${Object.keys(sorted).length} collections, ${td} documents`);
    if(!ver)log('warn','No version file in backup — controller version unknown');
    set({phase:'ready',colls:sorted,ver,act:null,step:''});
    toast(`Decrypted: ${Object.keys(sorted).length} collections, ${td.toLocaleString()} docs`);
  }catch(err){console.error(err);log('err',err.message);toast(err.message,'error');set({step:'❌ '+err.message})}
}

// Manual ZIP local-header scanner — parses entries without central directory
// Handles UniFi backups where central directory is missing or corrupt
function manualZipScan(buf){
  const b = new Uint8Array(buf);
  const entries = [];
  let i = 0;
  while(i < b.length - 30){
    // Look for PK\x03\x04 local file header
    if(b[i]===0x50&&b[i+1]===0x4B&&b[i+2]===0x03&&b[i+3]===0x04){
      try{
        const v = new DataView(buf);
        const flags      = v.getUint16(i+6,  true);
        const method     = v.getUint16(i+8,  true);
        let   crc32      = v.getUint32(i+14, true);
        let   compressed = v.getUint32(i+18, true);
        let   uncompressed = v.getUint32(i+22, true);
        const fnLen      = v.getUint16(i+26, true);
        const extraLen   = v.getUint16(i+28, true);
        const nameBytes  = b.slice(i+30, i+30+fnLen);
        const name       = new TextDecoder().decode(nameBytes);
        const dataStart  = i + 30 + fnLen + extraLen;

        // If data descriptor flag is set (bit 3), sizes may be 0 — scan for next PK
        if((flags & 0x08) && compressed === 0){
          // Find next PK\x03\x04 or PK\x01\x02 (central dir) to determine size
          let nextPK = dataStart;
          while(nextPK < b.length - 4){
            if(b[nextPK]===0x50&&b[nextPK+1]===0x4B&&(b[nextPK+2]===0x03||b[nextPK+2]===0x01||b[nextPK+2]===0x05))break;
            nextPK++;
          }
          // Step back over data descriptor (16 bytes: sig+crc+comp+uncomp) if present
          if(nextPK > dataStart + 16 && b[nextPK-16]===0x50&&b[nextPK-15]===0x4B&&b[nextPK-14]===0x07&&b[nextPK-13]===0x08)
            compressed = nextPK - dataStart - 16;
          else
            compressed = nextPK - dataStart;
        }

        if(compressed > 0 && dataStart + compressed <= b.length && name){
          const compData = buf.slice(dataStart, dataStart + compressed);
          const capturedMethod = method;
          const capturedUncompressed = uncompressed;
          entries.push({
            name,
            getData: async () => {
              if(capturedMethod === 0) return compData; // stored
              if(capturedMethod === 8){ // deflate
                try{
                  // pako inflate with raw deflate
                  return pako.inflateRaw(new Uint8Array(compData)).buffer;
                }catch(e){
                  log('warn',`Manual inflate failed for ${name}: ${e.message}`);
                  return compData;
                }
              }
              return compData;
            }
          });
          log('info',`Manual scan: ${name} method=${method} compressed=${fSz(compressed)}`);
          i = dataStart + compressed;
          continue;
        }
      }catch(e){log('warn',`Manual scan error @ ${i}: ${e.message}`);}
    }
    i++;
  }
  return entries;
}

function findPK(buf){const b=new Uint8Array(buf);for(let i=0;i<b.length-4;i++){if(b[i]===0x50&&b[i+1]===0x4B&&b[i+2]===0x03&&b[i+3]===0x04){log('ok',`PK signature @ byte ${i}`);return buf.slice(i)}}return null}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
